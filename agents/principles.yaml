version: 1
scope: These rules ONLY apply to coding tasks, not to general writing or office work.
instructions: All loaded principle instructions are mandatory, not optional guidance. Uphold every loaded principle unconditionally throughout the task. Do not silently skip, weaken, or replace any requirement. Read the leaf skill in full for any principle you apply. Each entry names when it applies. Each leaf is the **principle-<title>** skill, with the title in kebab case, hyphens kept and other punctuation dropped, unless the entry gives its name. These rules ONLY apply to coding tasks, not to general writing or office work.
principles:
- id: principle-laziness-protocol
  name: Laziness Protocol
  category: Core
  when: Refactoring, sizing a diff, or tempted to add abstractions, layers, or signal threading. Bias to deletion and the smallest change that solves the problem.
  path: skills/principle-laziness-protocol/SKILL.md
- id: principle-foundational-thinking
  name: Foundational Thinking
  category: Core
  when: 'Before writing logic: core types and data structures, scaffold-vs-feature sequencing, what concurrent actors share.'
  path: skills/principle-foundational-thinking/SKILL.md
- id: principle-redesign-from-first-principles
  name: Redesign from First Principles
  category: Core
  when: Integrating a new requirement into an existing design. Redesign as if it had been foundational from day one.
  path: skills/principle-redesign-from-first-principles/SKILL.md
- id: principle-attack-the-premise
  name: Attack the Premise
  category: Core
  when: Two or more fixes that share one premise have failed the same gate. Write the premise down and test it directly before you write another fix that assumes it.
  path: skills/principle-attack-the-premise/SKILL.md
- id: principle-subtract-before-you-add
  name: Subtract Before You Add
  category: Core
  when: Sequencing an addition, refactor, or rewrite. Remove dead weight first, then build on the simpler base.
  path: skills/principle-subtract-before-you-add/SKILL.md
- id: principle-minimize-reader-load
  name: Minimize Reader Load
  category: Core
  when: Reviewing or shaping code that's hard to trace. Count layers and hidden state, collapse one-caller wrappers, shrink mutable scope.
  path: skills/principle-minimize-reader-load/SKILL.md
- id: principle-outcome-oriented-execution
  name: Outcome-Oriented Execution
  category: Core
  when: Planned rewrites and migrations with explicit phase boundaries. Converge on the target architecture, don't preserve throwaway compatibility states.
  path: skills/principle-outcome-oriented-execution/SKILL.md
- id: principle-experience-first
  name: Experience First
  category: Core
  when: Product, UX, or feature-scope tradeoffs. Choose user delight over implementation convenience.
  path: skills/principle-experience-first/SKILL.md
- id: principle-exhaust-the-design-space
  name: Exhaust the Design Space
  category: Core
  when: A novel interaction or architectural decision with no precedent. Build 2-3 competing prototypes and compare before committing.
  path: skills/principle-exhaust-the-design-space/SKILL.md
- id: principle-build-the-lever
  name: Build the Lever
  category: Core
  when: Any non-trivial work. Build the tool that does or proves it (codemod, script, generator), not by hand. The tool is the artifact a reviewer reruns.
  path: skills/principle-build-the-lever/SKILL.md
- id: principle-model-the-domain
  name: Model the Domain
  category: Architecture
  when: Writing stateful logic, or code that branches a lot or repeats a shape assumption across files. Encode the domain in a structure (state machine, typed model, table or registry, reducer, boundary, the right collection) instead of scattered conditionals.
  path: skills/principle-model-the-domain/SKILL.md
- id: principle-boundary-discipline
  name: Boundary Discipline
  category: Architecture
  when: Wiring validation, error handling, or framework adapters. Guards at system boundaries, trust internal types, keep business logic pure.
  path: skills/principle-boundary-discipline/SKILL.md
- id: principle-type-system-discipline
  name: Type System Discipline
  category: Architecture
  when: Designing types or a signature in any typed language. Make illegal states unrepresentable, brand primitives, parse external data at boundaries.
  path: skills/principle-type-system-discipline/SKILL.md
- id: principle-make-operations-idempotent
  name: Make Operations Idempotent
  category: Architecture
  when: Designing commands, lifecycle steps, or loops that run amid crashes and retries. Converge to the same end state.
  path: skills/principle-make-operations-idempotent/SKILL.md
- id: principle-migrate-callers-then-delete-legacy-apis
  name: Migrate Callers Then Delete Legacy APIs
  category: Architecture
  when: Introducing a new internal API while old callers exist. Migrate and delete in one wave.
  path: skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md
- id: principle-separate-before-serializing-shared-state
  name: Separate Before Serializing Shared State
  category: Architecture
  when: Concurrent actors might write the same file, branch, key, or object. Eliminate the sharing first.
  path: skills/principle-separate-before-serializing-shared-state/SKILL.md
- id: principle-prove-it-works
  name: Prove It Works
  category: Verification
  when: After a task, before declaring done. Verify against the real artifact, not a proxy or "it compiles".
  path: skills/principle-prove-it-works/SKILL.md
- id: principle-fix-root-causes
  name: Fix Root Causes
  category: Verification
  when: Debugging. Trace each symptom back to the first place the system went wrong and fix it there. A guard is a fix only when the state it handles is legitimate.
  path: skills/principle-fix-root-causes/SKILL.md
- id: principle-sequence-verifiable-units
  name: Sequence Work into Verifiable Units
  category: Verification
  when: Multi-step work (sweeps, migrations, runs of similar edits) and how you stack commits and PRs. Break work into small units that each end in a check, verify each before the next, and order delivery so the sequence proves itself.
  path: skills/principle-sequence-verifiable-units/SKILL.md
- id: principle-test-behavior-not-implementation
  name: Test Behavior, Not Implementation
  category: Verification
  when: Writing, changing, or keeping a test. Assert what the code's users can observe, so the test fails when that behavior breaks and keeps passing when only the internals change.
  path: skills/principle-test-behavior-not-implementation/SKILL.md
- id: principle-explain-the-number
  name: Explain the Number
  category: Verification
  when: Before you trust, report, or act on a number you measured (a speedup, a regression, a throughput, a latency, or an eval result). Find what limits it, and rule out that it measured something other than the work you think.
  path: skills/principle-explain-the-number/SKILL.md
- id: principle-guard-the-context-window
  name: Guard the Context Window
  category: Delegation
  when: 'Context fills up: large outputs, long files, repeated reads, fan-out planning. Route bulk to subagents, keep summaries in the main thread.'
  path: skills/principle-guard-the-context-window/SKILL.md
- id: principle-never-block-on-the-human
  name: Never Block on the Human
  category: Delegation
  when: Tempted to ask "should I do X?" on reversible work. Proceed, present the result, let the human course-correct.
  path: skills/principle-never-block-on-the-human/SKILL.md
- id: principle-encode-lessons-in-structure
  name: Encode Lessons in Structure
  category: Meta
  when: You catch yourself writing the same instruction a second time. Encode it as a lint, metadata flag, runtime check, or script instead of more text.
  path: skills/principle-encode-lessons-in-structure/SKILL.md
